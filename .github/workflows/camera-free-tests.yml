name: Camera-free tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install Qt and plotting dependencies for GUI unit tests
        run: python -m pip install "PySide6>=6.7" "pyqtgraph>=0.13.7"
      - name: Verify Qt imports
        run: python -c "from PySide6.QtGui import QColor, QPalette; from PySide6.QtWidgets import QApplication; import pyqtgraph; print('Qt import: PASS')"
      - name: Run camera-free unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m unittest discover -v -s tests
