[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-exploration-lab"
version = "0.1.0"
description = "Offline-first Linux camera discovery and experiment workbench"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
celab = "camera_exploration_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
